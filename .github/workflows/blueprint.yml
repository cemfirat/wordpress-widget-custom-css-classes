name: WordPress plugin blueprint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  blueprint:
    name: WordPress plugin blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out pinned blueprint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cemfirat/repository-governance
          ref: ad1a76a6830bef746aac73d551aa58aa14c36340
          path: .ccf-governance
          persist-credentials: false

      - name: Audit plugin against blueprint
        run: >-
          python3 .ccf-governance/scripts/wordpress-plugin-blueprint.py
          --governance-root .ccf-governance
          audit
          --plugin-root .
