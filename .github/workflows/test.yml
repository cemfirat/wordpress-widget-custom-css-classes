name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4', '8.5']

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run regression tests
        run: php tests/run.php


  package:
    name: Deterministic package
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify deterministic ZIP
        run: python3 tests/package.py


  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.0'
          - wordpress: latest
            php: '8.3'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: wp-cli:2.12.0
          coverage: none

      - name: Package and install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          python3 scripts/package.py
          wp core download --path="$RUNNER_TEMP/wordpress" --version="$WP_VERSION"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=Test --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          unzip -q dist/wordpress-widget-custom-css-classes.zip -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          wp plugin activate wordpress-widget-custom-css-classes --path="$RUNNER_TEMP/wordpress"

      - name: Verify plugin in real WordPress
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path="$RUNNER_TEMP/wordpress"
