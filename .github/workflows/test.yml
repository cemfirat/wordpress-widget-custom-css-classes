name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.4', '8.5']

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run regression tests
        run: php tests/run.php


  package:
    name: Deterministic package
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify deterministic ZIP
        run: python3 tests/package.py


  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.0'
          - wordpress: latest
            php: '8.3'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          tools: wp-cli:2.12.0
          coverage: none

      - name: Package and install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          python3 scripts/package.py
          wp core download --path="$RUNNER_TEMP/wordpress" --version="$WP_VERSION"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=Test --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          unzip -q dist/wordpress-widget-custom-css-classes.zip -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          wp plugin activate wordpress-widget-custom-css-classes --path="$RUNNER_TEMP/wordpress"

      - name: Verify plugin in real WordPress
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path="$RUNNER_TEMP/wordpress"


  plugin-check:
    name: WordPress Plugin Check pilot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip
          tools: wp-cli:2.12.0
          coverage: none

      - name: Install WordPress and package
        run: |
          set -euo pipefail
          python3 scripts/package.py
          wp core download --path="$RUNNER_TEMP/wordpress"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=PluginCheck --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install plugin-check --activate --path="$RUNNER_TEMP/wordpress"
          unzip -q dist/wordpress-widget-custom-css-classes.zip -d "$RUNNER_TEMP/wordpress/wp-content/plugins"

      - name: Run Plugin Check pilot
        run: |
          set -euo pipefail
          set +e
          wp plugin check "$RUNNER_TEMP/wordpress/wp-content/plugins/wordpress-widget-custom-css-classes" \
            --categories=plugin_repo \
            --format=json \
            --error-severity=7 \
            --warning-severity=6 \
            --include-low-severity-errors \
            --exclude-checks=prefixing \
            --path="$RUNNER_TEMP/wordpress" \
            > "$RUNNER_TEMP/plugin-check.json"
          status=$?
          set -e

          cat "$RUNNER_TEMP/plugin-check.json"

          python3 - "$RUNNER_TEMP/plugin-check.json" "$status" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          exit_status = int(sys.argv[2])
          raw = path.read_text(encoding="utf-8").strip()

          try:
              value = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Plugin Check did not return valid JSON: {exc}") from exc

          if isinstance(value, list):
              issues = value
          elif isinstance(value, dict):
              for key in ("results", "issues", "messages"):
                  if isinstance(value.get(key), list):
                      issues = value[key]
                      break
              else:
                  issues = [value] if value else []
          else:
              raise SystemExit("Unexpected Plugin Check JSON shape")

          print(f"Plugin Check pilot: exit={exit_status}, findings={len(issues)}")

          if exit_status not in (0, 1):
              raise SystemExit(f"Plugin Check command failed unexpectedly with exit {exit_status}")
          PY
